  <text x="462" y="214" font-size="13.5" font-weight="bold" fill="#7C4A03">Schema gate</text>
  <text x="462" y="230" font-size="11" fill="#8D5A10">LLM extractor ·</text>
  <text x="462" y="242" font-size="11" fill="#8D5A10">inputs bound?</text>
