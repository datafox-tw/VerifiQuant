  <g transform="translate(80 0)">
  <rect x="448" y="318" width="124" height="58" rx="7" fill="#FDECEA" stroke="#C0392B" stroke-width="1.3"/>
  <text x="460" y="338" font-size="12.5" font-weight="bold" fill="#7B241C">error / F</text>
  <text x="460" y="354" font-size="11" fill="#922B21">requested fields</text>
  <text x="460" y="366" font-size="11" fill="#922B21">slot-filling request</text>
