  <rect x="1088" y="48" width="26" height="16" rx="4" fill="#37474F"/><text x="1101" y="60" font-size="11.5" fill="#fff" text-anchor="middle">C4</text>
  <text x="952" y="64" font-size="14" font-weight="bold" fill="#5B21A6">Verified transform</text>
