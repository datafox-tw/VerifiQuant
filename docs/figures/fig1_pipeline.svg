  <g transform="translate(110 0)">
  <rect x="604" y="166" width="124" height="92" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.6"/>
  <rect x="694" y="172" width="26" height="16" rx="4" fill="#37474F"/><text x="707" y="184" font-size="11.5" fill="#fff" text-anchor="middle">C2</text>
