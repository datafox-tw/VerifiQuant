  <path d="M 1278 108 C 1272 132, 1256 148 1232 162" fill="none" stroke="#7B2FBE" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrP)"/>
  <text x="1288" y="132" font-size="10.5" fill="#7B2FBE">accepted iff</text>
  <text x="1288" y="144" font-size="10.5" fill="#7B2FBE">identity holds</text>

