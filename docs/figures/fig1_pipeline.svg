  <text x="306" y="214" font-size="13.5" font-weight="bold" fill="#7C4A03">Scope gate</text>
  <text x="306" y="230" font-size="11" fill="#8D5A10">any applicable FIC?</text>
  <text x="306" y="242" font-size="11" fill="#8D5A10">BM25 + hints</text>
