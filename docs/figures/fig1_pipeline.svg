  <line x1="590" y1="258" x2="590" y2="314" stroke="#C0392B" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="776" y1="258" x2="776" y2="314" stroke="#C0392B" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="974" y1="258" x2="974" y2="314" stroke="#C0392B" stroke-width="1.4" marker-end="url(#arr)"/>

