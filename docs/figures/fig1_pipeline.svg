  <rect x="0" y="0" width="1520" height="560" fill="#FFFFFF"/>
  <text x="16" y="28" font-size="14" fill="#607D8B">VerifiQuant pipeline — governance controls compiled into execution (badges C1–C6 ↔ Table 1)</text>

  <!-- FIC card store -->
  <rect x="156" y="42" width="682" height="60" rx="8" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.5"/>
  <text x="174" y="64" font-size="14.5" font-weight="bold" fill="#311B92">FIC Card Store (build-time compiled, lint- and smoke-gated)</text>
  <text x="174" y="80" font-size="12" fill="#4527A0">retrieval cards · core cards · repair rules</text>
  <text x="174" y="96" font-size="12" fill="#4527A0">typed inputs · deterministic code · invariants · semantic hints</text>

  <!-- store feeds gates -->
  <line x1="218" y1="102" x2="218" y2="162" stroke="#9575CD" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <line x1="404" y1="102" x2="404" y2="162" stroke="#9575CD" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <line x1="590" y1="102" x2="590" y2="162" stroke="#9575CD" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <line x1="776" y1="102" x2="776" y2="162" stroke="#9575CD" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <line x1="838" y1="98" x2="968" y2="162" stroke="#9575CD" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr)"/>

